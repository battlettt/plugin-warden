[project]
name = "plugin-warden"
version = "0.1.0"
description = "Audit a Claude Code plugin, MCP server or skill repo before you install it: static rules, a Claude Agent SDK triage agent, and a troubleshooting chat."
readme = "README.md"
license = "MIT"
authors = [
    { name = "battlettt", email = "99453095+battlettt@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.179",
    "rich>=15.0.0",
]

[project.scripts]
warden = "plugin_warden.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
markers = [
    "live: calls the Claude API (needs ANTHROPIC_API_KEY); skipped by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]
